<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery — My Summer Trip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">ASHISH</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="gallery.html">Gallery</a></li>
    </ul>
  </nav>

  <header class="hero">
    <div class="hero-content">
      <h1>Photo Gallery</h1>
      <div class="divider"></div>
      <p class="subtitle">My Summer Trip</p>
    </div>
  </header>

  <main class="container">
    <section class="intro">
      <h2>Snapshots from My Journey</h2>
      <p>Click any photograph to view it in its original size.</p>
    </section>

    <section class="city">
      <h2>Featured Photographs</h2>
      <div class="gallery">
        <figure>
          <a href="images/gallery1.jpg" target="_blank">
            <img src="images/gallery1.jpg" alt="Aerial view of Paris.">
          </a>
          <figcaption>Paris from above</figcaption>
        </figure>
        <figure>
          <a href="images/gallery2.jpg" target="_blank">
            <img src="images/gallery2.jpg" alt="Belgian waffle with chocolate.">
          </a>
          <figcaption>Belgian Waffles</figcaption>
        </figure>
        <figure>
          <a href="images/gallery3.jpg" target="_blank">
            <img src="images/gallery3.jpg" alt="Vintage car on a cobblestone street in Brussels.">
          </a>
          <figcaption>Brussels Streets</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer><p>&copy; 2026 Ashish — A travel journal from my summer in Paris &amp; Brussels.</p></footer>
</body>
</html>

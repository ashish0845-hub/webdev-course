<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S7 - Contact Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">ASHISH</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="contact.html" aria-current="page">Contact</a></li>
    </ul>
  </nav>

  <header class="hero">
    <div class="hero-content">
      <h1>Contact Us</h1>
      <div class="divider"></div>
      <p class="subtitle">Send me a message</p>
    </div>
  </header>

  <main class="container">
    <section class="topics" id="contact" style="text-align: center; margin-bottom: 30px;">
      <h2>Get in Touch</h2>
      <p>Fill out the form below to send me a message.</p>
    </section>

    <!-- The Form (using the card class for styling) -->
    <form class="card form-card" action="https://httpbin.org/post" method="post">
      
      <div class="form-group">
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="form-group">
        <label for="email">Email address *</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone">
      </div>

      <div class="form-group">
        <label for="subject">Contact subject *</label>
        <select id="subject" name="subject" required>
          <option value="">Choose a subject</option>
          <option value="feedback">Feedback</option>
          <option value="question">Question</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group radio-group">
        <span>Preferred contact method:</span>
        <label><input type="radio" name="contact_method" value="email" checked> Email</label>
        <label><input type="radio" name="contact_method" value="phone"> Phone</label>
      </div>

      <div class="form-group">
        <label for="message">Message *</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>

      <button type="submit" class="btn-submit">Submit</button>

    </form>
  </main>

  <footer><p>&copy; 2026 Ashish — A travel journal from my summer in Paris &amp; Brussels.</p></footer>
</body>
</html>
